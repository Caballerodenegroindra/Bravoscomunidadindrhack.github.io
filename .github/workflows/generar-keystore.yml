name: Generar keystore (UNA SOLA VEZ)

# Este workflow se corre a mano, una sola vez.
# Crea la llave de firma de tu app y te la deja para descargar,
# junto con su version en base64 y su huella SHA-256.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Java (trae keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verificar que las contrasenas esten cargadas
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "FALTAN los secretos ANDROID_KEYSTORE_PASSWORD y/o ANDROID_KEY_PASSWORD."
            echo "Cargalos primero en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Contrasenas encontradas. Sigo."

      - name: Crear el keystore
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore android-release.keystore \
            -alias indrhack \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Academia Indra, OU=Indrhack, O=Academia Indra, L=NA, ST=NA, C=AR"

      - name: Sacar la huella SHA-256
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore android-release.keystore \
            -alias indrhack -storepass "$KS_PASS" \
            | grep -i "SHA256:" | tee huella-sha256.txt

      - name: Convertir a base64
        run: |
          base64 -w 0 android-release.keystore > keystore-base64.txt
          echo "Listo. Descarga el artefacto de abajo."

      - name: Dejar todo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: LLAVE-GUARDALA-BIEN
          path: |
            android-release.keystore
            keystore-base64.txt
            huella-sha256.txt
          retention-days: 1
